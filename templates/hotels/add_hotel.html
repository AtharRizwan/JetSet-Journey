{% extends "base.html" %}
{% block body %}
{% for message in messages %}
<div class="alert alert-success" role="alert">{{ message }}</div>
{% endfor %}
<h1 class="text-center mt-4">Add a Hotel</h1>
<div class="container">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <input class="btn btn-dark" type="submit" value="Add Hotel">
    </form>
</div>
{% endblock body %}
