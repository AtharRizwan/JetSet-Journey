{% load static %}
        <header
            class="bg-gradient-to-b from-slate-100 via-white to-transparent opacity-90 text-xl font-serif font-bold -mt-7">

                    <img class="h-20 w-auto" src="{% static 'img/logo2.png' %}" alt="">
