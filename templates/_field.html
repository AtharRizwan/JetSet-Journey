{# One form field with its label, help text and errors; styled by .form-field in static/src/input.css. #}
<div class="form-field{% if wide %} sm:col-span-2{% endif %}">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
    {{ field.errors }}
</div>
