{% if messages %}
<div class="flex flex-col items-center gap-2 mt-4">
    {% for message in messages %}
    <div class="px-4 py-2 rounded-md shadow-md font-medium {% if message.tags == 'error' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
