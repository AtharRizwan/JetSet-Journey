{% load static %}
<figure class="flex flex-col items-center">
    <img src="{% static image %}" alt="{{ name }}" class="w-56 h-56 object-cover rounded-full shadow-xl" loading="lazy">
    <figcaption class="mt-4 w-full p-6 border-4 border-cyan-500 rounded shadow text-gray-300 bg-gray-800 text-center">
        <p class="text-xl font-bold text-white">{{ name }}</p>
        <p class="text-lg font-semibold">{{ role }}</p>
    </figcaption>
</figure>
