{% extends "card.html" %}

{% block title %}Log In{% endblock %}
{% block heading %}Log In{% endblock %}

{% block card %}
<form method="POST" action="{% url 'log_in' %}" class="flex flex-col gap-4">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="form-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-primary mt-2">Log In</button>
    <p class="text-sm">Don't have an account? <a class="underline" href="{% url 'register' %}">Sign up</a></p>
</form>
{% endblock %}
