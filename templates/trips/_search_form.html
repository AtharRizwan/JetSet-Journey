{# Flight/bus search form. Include with service_name (the POST field) and service_label. #}
{% now "Y-m-d" as today %}
<form method="post" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    {% csrf_token %}
    <h3 class="panel-title sm:col-span-2">Destination Information</h3>
    <div class="form-field">
        <label for="departure">Departure City</label>
        <input type="text" id="departure" name="departure_city" placeholder="e.g. Lahore" autocomplete="off" required>
    </div>
    <div class="form-field">
        <label for="destination">Destination City</label>
        <input type="text" id="destination" name="destination_city" placeholder="e.g. Karachi" autocomplete="off" required>
    </div>
    <div class="form-field">
        <label for="departure-date">Departure Date</label>
        <input type="date" id="departure-date" name="departure_date" min="{{ today }}" required>
    </div>
    <div class="form-field">
        <label for="service">{{ service_label }}</label>
        <select id="service" name="{{ service_name }}">
            <option value="">Any</option>
            {% for operator in operators %}
            <option value="{{ operator }}"{% if operator|lower == selected_operator|lower %} selected{% endif %}>{{ operator }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="{{ button_class }} sm:col-span-2 mt-3">Search</button>
</form>
