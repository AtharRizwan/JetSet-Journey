<li class="flex flex-1 items-center gap-3 px-4 py-3 rounded-lg min-w-max md:min-w-0 {% if n == current %}bg-black/25{% else %}opacity-75{% endif %}"
    {% if n == current %}aria-current="step"{% endif %}>
    <span class="rounded-full px-2 border-white border-2">{{ n }}</span>
    <span>{{ label }}</span>
</li>
